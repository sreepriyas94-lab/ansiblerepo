- name: Install and start apache2
  hosts: local_server
  become: yes
  gather_facts: yes
  tasks:
    - name: Install Apache2
      apt:
        name: apache2
        state: present
        update_cache: yes
      when: ansible_distribution == "Ubuntu"
      notify:
          - restart apache2
          - clear cache

    - name: apache2 enable
      service:
        name: apache2
        state: started
        enabled: yes

  handlers:
    - name: restart apache2
      service:
        name: apache2
        state: restarted

    - name: clear cache
      command: rm -rf /var/log/nginx/*
