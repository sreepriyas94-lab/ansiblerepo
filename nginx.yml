- name: install and start nginx
  hosts: all
  strategy: host_pinned
  gather_facts: yes
  become: yes
  tasks:
   - name: install nginx
     yum:
      name: nginx
      state: present
  - name: start nginx
    service:
      name: nginx
      state: started
      enabled: no
    - name: stop nginx
      service:
        name: nginx
        state: stopped
        enabled: no
